[project]
name = "anki-scribe"
version = "0.1.0"
description = "Select text on a PDF or a page photo, let DeepSeek write Anki cards, push them to Anki."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "httpx>=0.27",
    "rapidocr-onnxruntime>=1.4,<2",
    "winocr>=0.0.15; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
